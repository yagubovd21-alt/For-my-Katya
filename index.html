<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>My Love ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

body{
    /* Разрешаем скролл */
    overflow-x: hidden;
    overflow-y: auto; 
    background: radial-gradient(circle at top,#2b0b38 0%,#120016 45%,#000 100%);
    min-height: 100vh;
    font-family:'Montserrat',sans-serif;
    color:white;
    position:relative;
}

/* Звезды на фоне всегда зафиксированы */
.stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events: none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:#ff9ed1;
    border-radius:50%;
    animation:blink 2s infinite;
}

@keyframes blink{
    0%{opacity:.2}
    50%{opacity:1}
    100%{opacity:.2}
}

.main{
    position:relative;
    z-index:10;
    width: 100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:flex-start; /* Начинаем сверху для удобства скролла */
    align-items:center;
    padding: 60px 20px;
}

.title{
    font-family:'Caveat',cursive;
    font-size: clamp(38px, 8vw, 64px);
    color:#ffb6dd;
    margin-bottom:30px;
    text-align: center;
    text-shadow:0 0 25px rgba(255,105,180,.8);
}

.love-heart{
    cursor:pointer;
    display:inline-block;
    animation: heartBeat 1.5s infinite;
}

@keyframes heartBeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.morse-wrapper{
    width: 100%;
    max-width: 600px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap: 10px;
    margin-bottom: 40px;
}

.morse{
    position:relative;
    color:#ff9ed1;
    font-size: 18px;
    letter-spacing: 2px;
}

.tooltip{
    position:absolute;
    bottom:-35px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(20,0,30,0.9);
    padding:4px 8px;
    border-radius:8px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
}

/* На мобилках показываем перевод при нажатии */
.morse:active .tooltip { opacity: 1; }

.center-photo{
    width: 100%;
    max-width: 380px;
    margin-bottom: 35px;
    position: relative;
}

.center-photo img{
    width: 100%;
    height: auto;
    border-radius:30px;
    border:2px solid rgba(255,180,220,0.2);
    box-shadow:0 0 40px rgba(255,105,180,0.3);
}

.player{
    width: 100%;
    max-width:320px;
    padding:20px;
    border-radius:24px;
    background:rgba(255,255,255,0.07);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,180,220,0.2);
}

.song-name{
    color:#ffd4ea;
    font-size:12px;
    margin-bottom: 12px;
    text-align: center;
}

.bar{
    width:100%;
    height:4px;
    background:rgba(255,255,255,0.1);
    border-radius:10px;
    overflow:hidden;
}

.bar span{
    display:block;
    width:100%;
    height:100%;
    background: linear-gradient(90deg, #ff8cca, #ffb6dd);
    transform: scaleX(0);
    transform-origin: left;
}

.playing .bar span {
    animation: progress 200s linear forwards;
}

@keyframes progress {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
}

/* ГАЛЕРЕЯ */
.gallery{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow: hidden;
}

.floating-photo{
    position:absolute;
    bottom:-150px;
    border-radius:15px;
    overflow:hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: flyUp linear forwards;
    opacity: 0;
}

.floating-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

@keyframes flyUp {
    0% { transform: translateY(0) rotate(var(--r)); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-120vh) rotate(var(--r)); opacity: 0; }
}

/* МОДАЛКА */
.modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 20px;
}

.modal-content {
    background: #1a0022;
    padding: 30px 25px;
    border-radius: 30px;
    max-width: 500px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    border: 1px solid rgba(255,182,221,0.3);
}

.modal-text {
    font-size: 16px;
    line-height: 1.7;
    color: #ffd6eb;
    white-space: pre-line;
    text-align: center;
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="gallery" id="gallery"></div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="main">
    <h1 class="title">
        My Love
        <span class="love-heart" onclick="openLoveMessage()">♡</span>
    </h1>

    <div class="morse-wrapper">
        <div class="morse">.--.<div class="tooltip">Я</div></div>
        <div class="morse">-<div class="tooltip">Т</div></div>
        <div class="morse">.<div class="tooltip">Е</div></div>
        <div class="morse">-...<div class="tooltip">Б</div></div>
        <div class="morse">.--.<div class="tooltip">Я</div></div>
        <div class="morse">-...<div class="tooltip">Б</div></div>
        <div class="morse">.<div class="tooltip">Е</div></div>
        <div class="morse">--..<div class="tooltip">З</div></div>
        <div class="morse">..-<div class="tooltip">У</div></div>
        <div class="morse">--<div class="tooltip">М</div></div>
        <div class="morse">-.<div class="tooltip">Н</div></div>
        <div class="morse">---<div class="tooltip">О</div></div>
        <div class="morse">...<div class="tooltip">С</div></div>
        <div class="morse">..<div class="tooltip">И</div></div>
        <div class="morse">.-..<div class="tooltip">Л</div></div>
        <div class="morse">-.--<div class="tooltip">Ь</div></div>
        <div class="morse">-.<div class="tooltip">Н</div></div>
        <div class="morse">---<div class="tooltip">О</div></div>
        <div class="morse">.-..<div class="tooltip">Л</div></div>
        <div class="morse">..--<div class="tooltip">Ю</div></div>
        <div class="morse">-...<div class="tooltip">Б</div></div>
        <div class="morse">.-..<div class="tooltip">Л</div></div>
        <div class="morse">..--<div class="tooltip">Ю</div></div>
        <div class="morse">--<div class="tooltip">М</div></div>
        <div class="morse">---<div class="tooltip">О</div></div>
        <div class="morse">.--.<div class="tooltip">Я</div></div>
        <div class="morse">-.-<div class="tooltip">К</div></div>
        <div class="morse">.-<div class="tooltip">А</div></div>
        <div class="morse">-<div class="tooltip">Т</div></div>
        <div class="morse">..--<div class="tooltip">Ю</div></div>
        <div class="morse">-.<div class="tooltip">Н</div></div>
        <div class="morse">.--.<div class="tooltip">Я</div></div>
    </div>

    <div class="center-photo">
        <img src="main-photo.jpg">
    </div>

    <div id="playerContainer" class="player">
        <div class="song-name">♡ Beautiful Boys — Нежная Любовь</div>
        <div class="bar"><span></span></div>
    </div>
</div>

<div id="loveModal" class="modal-overlay" onclick="closeLoveMessage()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-text" id="modalText"></div>
    </div>
</div>

<script>
const audio = document.getElementById('bgMusic');
const player = document.getElementById('playerContainer');

function startMusic() {
    audio.play().then(() => {
        player.classList.add('playing');
    }).catch(e => {});
}

document.addEventListener('touchstart', startMusic, { once: true });
document.addEventListener('click', startMusic, { once: true });

function openLoveMessage(){
    const modal = document.getElementById('loveModal');
    const modalText = document.getElementById('modalText');
    // ВСТАВЬ СВОЙ ТЕКСТ НИЖЕ
    modalText.innerText = `Я люблю тебя — не как случайную мысль... (твой полный текст)`;
    modal.style.display = 'flex';
    startMusic();
}

function closeLoveMessage() {
    document.getElementById('loveModal').style.display = 'none';
}

// Звезды
const starsContainer = document.querySelector('.stars');
for(let i=0;i<60;i++){
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.left = Math.random()*100+'%';
    star.style.top = Math.random()*100+'%';
    starsContainer.appendChild(star);
}

// УЛУЧШЕННЫЙ СКРИПТ ФОТО ДЛЯ МОБИЛОК
const gallery = document.getElementById('gallery');
const totalPhotos = 230;

function createPhoto() {
    const num = Math.floor(Math.random() * totalPhotos) + 1;
    const img = new Image();
    
    // Важно: на мобилках лучше не перегружать запросами
    img.src = `photo${num}.jpg`;

    img.onload = () => {
        const div = document.createElement('div');
        div.classList.add('floating-photo');
        
        // Размеры для мобилок
        const width = window.innerWidth < 500 ? (70 + Math.random()*60) : (120 + Math.random()*80);
        
        div.style.width = width + 'px';
        div.style.left = Math.random() * (window.innerWidth - width) + 'px';
        div.style.setProperty('--r', (-15 + Math.random()*30) + 'deg');
        div.style.animationDuration = (8 + Math.random()*10) + 's';
        
        div.appendChild(img);
        gallery.appendChild(div);
        
        setTimeout(() => div.remove(), 18000);
    };
}

// Запускаем чаще, но меньшее количество одновременно
setInterval(createPhoto, 2000);
// Первый запуск нескольких штук
for(let i=0; i<5; i++) setTimeout(createPhoto, i*500);

</script>
</body>
</html>
